name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_demucs:
        description: "Also build/push the WITH_DEMUCS=true (vocal-stripping) variant, tagged :demucs. Pulls ~2GB of torch, slow."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_worker.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Target is a Synology DS920+ (Celeron J4125, x86_64) -- linux/amd64
      # regardless of what the runner's own arch is.
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WITH_DEMUCS=false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Manual-only: demucs needs torch, which the target NAS's non-AVX CPU
      # may not even run (see the plan's Synology section) -- never built
      # implicitly on every push.
      - if: ${{ inputs.with_demucs }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WITH_DEMUCS=true
          tags: ghcr.io/${{ github.repository }}:demucs
          cache-from: type=gha
          cache-to: type=gha,mode=max
