name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_demucs:
        description: "Also build/push the WITH_DEMUCS=true (vocal-stripping) variant, tagged :demucs. Pulls ~2GB of torch, slow."
        type: boolean
        default: false
      with_transcribe:
        description: "Also build/push the WITH_TRANSCRIBE=true (Whisper hardsub ASR) variant, tagged :transcribe."
        type: boolean
        default: false
      with_translate:
        description: "Also build/push the WITH_TRANSLATE=true (argos-translate offline subtitle translation) variant, tagged :translate."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_worker.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Target is a Synology DS920+ (Celeron J4125, x86_64) -- linux/amd64
      # regardless of what the runner's own arch is.
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WITH_DEMUCS=false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Manual-only: demucs needs torch, which the target NAS's non-AVX CPU
      # may not even run (see the plan's Synology section) -- never built
      # implicitly on every push.
      - if: ${{ inputs.with_demucs }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WITH_DEMUCS=true
          tags: ghcr.io/${{ github.repository }}:demucs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Manual-only, same reasoning as with_demucs above: faster-whisper's
      # ctranslate2 backend is expected to fare better than torch on a
      # non-AVX CPU but this hasn't been proven on the actual NAS hardware.
      - if: ${{ inputs.with_transcribe }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WITH_TRANSCRIBE=true
          tags: ghcr.io/${{ github.repository }}:transcribe
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Manual-only, same reasoning as with_demucs/with_transcribe above.
      # WITH_TRANSCRIBE stays false here -- a combined Whisper+translate
      # build is a one-line edit to this step's build-args if/when someone
      # actually wants that, not a tag worth building by default.
      - if: ${{ inputs.with_translate }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WITH_TRANSLATE=true
          tags: ghcr.io/${{ github.repository }}:translate
          cache-from: type=gha
          cache-to: type=gha,mode=max
