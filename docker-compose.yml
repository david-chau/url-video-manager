# .github/workflows/publish.yml builds + pushes :latest (linux/amd64, for
# the NAS's Celeron) on every push to main. NAS side is pull-only:
#   docker compose pull && docker compose up -d
# Vocal separation (Phase 5) needs a WITH_DEMUCS=true build (~2GB torch) --
# check the plan's Synology section first, non-AVX CPUs may not run torch at
# all. That variant is manual-only: Actions tab -> Publish image -> Run
# workflow -> with_demucs, tagged :demucs rather than overwriting :latest.
# Hardsub subtitle generation (Phase 7, gen_subs='whisper'/'ocr'/'both')
# needs a WITH_TRANSCRIBE=true build for the Whisper half -- same
# manual-only :transcribe tag, same non-AVX caveat as demucs (see the
# Dockerfile's WITH_TRANSCRIBE comment). OCR (tesseract) needs no build
# flag at all -- it's in every image.
# Subtitle translation (Phase 8, translate_to) needs a WITH_TRANSLATE=true
# build (argos-translate/ctranslate2, same size/risk as WITH_TRANSCRIBE) --
# same manual-only :translate tag. Language-pair models download into
# TRANSLATE_MODEL_DIR (under /data) on first use, not baked into the image.
services:
  app:
    image: ghcr.io/david-chau/url-video-manager:latest
    ports:
      # All interfaces, not 127.0.0.1: a loopback bind on a headless NAS is
      # only reachable from the NAS itself.
      - "1208:8080"
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    environment:
      MAX_CONCURRENT: "2"
      SEPARATION_SLOTS: "1"     # demucs is CPU/RAM-heavy; its own semaphore, independent of MAX_CONCURRENT
      DEMUCS_MODEL: "htdemucs"  # mdx_extra_q is faster/lower-quality if htdemucs is too slow
      KEEP_VOCALS: ""           # unset = discard the isolated vocal track; set "1" to keep it alongside novocals
      AUDIO_FORMAT: ""          # unset = passthrough (keep source m4a/opus); set "mp3" to force re-encode
      TRANSCRIBE_SLOTS: "1"     # Whisper/OCR are CPU-heavy too; own semaphore, independent of MAX_CONCURRENT/SEPARATION_SLOTS
      WHISPER_MODEL: "small"    # 'base' is the faster/lower-quality fallback if 'small' is too slow on the Celeron
      OCR_SAMPLE_FPS: "2"       # frames/sec sampled for hardsub OCR
      OCR_CROP_BOTTOM_PCT: "0.22"  # bottom fraction of the frame OCR'd (where hardsubs almost always sit)
      OCR_LANG: "chi_sim+chi_tra+eng"  # tesseract '+'-joined lang packs, used when a job has no gen_subs_lang hint -- chi_sim+eng alone (no chi_tra) is confirmed to garble CJK text, see worker.py's OCR_LANG comment
      OCR_BINARIZE: "1"         # per-frame Otsu thresholding before OCR; stylized hardsubs (gradient fill + outline over moving video) are unreadable to tesseract without it. Set "0" to disable if some subtitle style reads worse with it
      TRANSLATE_MODEL_DIR: "/data/argos-models"  # argos-translate language-pair models, downloaded on first use
      WHISPER_MODEL_DIR: "/data/whisper-models"  # faster-whisper model (~500MB for 'small'), downloaded on first use. Must live on /data: the default cache is under $HOME, which is '/' when `user:` below is set, and a non-root container can't write there
      YTDLP_COOKIES: "/data/cookies.txt"
      APP_PASSWORD: ""          # unset by default; set to require HTTP Basic auth on every route
    # On Synology, uncomment and set to your `id <you>` uid:gid (usually the
    # `users` group, 100) so downloads aren't root-owned in the shared folder.
    # user: "1026:100"
    restart: unless-stopped
